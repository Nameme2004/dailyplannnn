        dueField.appendChild(dueInput);
        grid.appendChild(dueField);
        var estimateField = makeEl('div', 'edit-field');
        estimateField.appendChild(makeEl('label', '', '预估耗时（分钟）'));
        var estimateInput = makeEl('input', '');
        estimateInput.type = 'number';
        estimateInput.min = '0';
        estimateInput.id = 'wizardEstimate';
        estimateInput.value = wizard.estimate;
        estimateField.appendChild(estimateInput);
        grid.appendChild(estimateField);
        body.appendChild(grid);

        var tagsField = makeEl('div', 'edit-field');
        tagsField.appendChild(makeEl('label', '', '标签'));
        var presetWrap = makeEl('div', 'preset-tags');
        var existing = allTags();
        existing.forEach(function (tag) {
          var presetBtn = makeEl('button', 'preset-tag-btn' + (wizard.tags.indexOf(tag) >= 0 ? ' selected' : ''), tag);
          presetBtn.type = 'button';
          presetBtn.dataset.action = 'choose-preset-tag';
          presetBtn.dataset.tag = tag;
          presetWrap.appendChild(presetBtn);
        });
        tagsField.appendChild(presetWrap);
        var customInput = makeEl('input', '');
        customInput.type = 'text';
        customInput.id = 'wizardCustomTag';
        customInput.placeholder = '输入自定义标签后回车';
        customInput.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter') return;
          var value = customInput.value.trim();
          if (value && wizard.tags.indexOf(value) < 0) wizard.tags.push(value);
          customInput.value = '';
          renderWizard();
        });
        tagsField.appendChild(customInput);
        if (wizard.tags.length) {
          var chosen = makeEl('div', 'chosen-tags');
          wizard.tags.forEach(function (tag) {
            var chip = makeEl('span', 'chosen-tag');
            chip.appendChild(document.createTextNode(tag));
            var remove = makeEl('button', '', '×');
            remove.type = 'button';
            remove.dataset.action = 'remove-tag';
            remove.dataset.tag = tag;
            chip.appendChild(remove);
            chosen.appendChild(chip);
          });
          tagsField.appendChild(chosen);
        }
        body.appendChild(tagsField);
        $('#wizardBackBtn').disabled = false;
        $('#wizardBackBtn').style.opacity = '1';
        $('#wizardNextBtn').textContent = '完成';
        dueInput.addEventListener('input', function () { wizard.dueDate = dueInput.value; });
        estimateInput.addEventListener('input', function () { wizard.estimate = Number(estimateInput.value) || 0; });
        setTimeout(function () { dueInput.focus(); }, 0);
      }
    }

    function wizardNext() {
      if (wizard.step === 0) {
        if (!wizard.text.trim()) {
          var input = $('#wizardTextInput');
          if (input) input.focus();
          return;
        }
        wizard.step = 1;
      } else if (wizard.step === 1) {
        wizard.step = 2;
      } else if (wizard.step === 2) {
        wizard.step = wizard.metricType === 'text' ? 4 : 3;
      } else if (wizard.step === 3) {
        if (!wizard.target || wizard.target <= 0) return;
        wizard.step = 4;
      } else if (wizard.step === 4) {
        state.todos.push({
          id: uid(),
          text: wizard.text.trim(),
          quadrant: wizard.quadrant,
          metricType: wizard.metricType,
          metricValue: 0,
          targetValue: wizard.metricType === 'text' ? 0 : wizard.target,
          dueDate: wizard.dueDate,
          estimate: wizard.estimate,
          tags: wizard.tags.slice(),
          note: '',
          done: false
        });
        ensureTags(wizard.tags);
        saveTodos();
        closeWizard();
        $('#todoTextInput').value = '';
        renderTodos();
        return;
      }
      renderWizard();
    }

    function wizardBack() {
      if (wizard.step === 1) wizard.step = 0;
      else if (wizard.step === 2) wizard.step = 1;
      else if (wizard.step === 3) wizard.step = 2;
      else if (wizard.step === 4) wizard.step = wizard.metricType === 'text' ? 2 : 3;
      renderWizard();
    }

    $('#wizardBody').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'choose-quadrant') {
        wizard.quadrant = Number(btn.dataset.quadrant);
        renderWizard();
      } else if (btn.dataset.action === 'choose-type') {
        wizard.metricType = btn.dataset.type;
        renderWizard();
      } else if (btn.dataset.action === 'choose-preset-tag') {
        var tag = btn.dataset.tag;
        var index = wizard.tags.indexOf(tag);
        if (index >= 0) wizard.tags.splice(index, 1);
        else wizard.tags.push(tag);
        renderWizard();
      } else if (btn.dataset.action === 'remove-tag') {
        wizard.tags = wizard.tags.filter(function (t) { return t !== btn.dataset.tag; });
        renderWizard();
      }
    });

    $('#addTodoBtn').addEventListener('click', function () {
      openTodoWizard($('#todoTextInput').value);
    });
    $('#todoTextInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') openTodoWizard($('#todoTextInput').value);
    });
    $('#wizardNextBtn').addEventListener('click', wizardNext);
    $('#wizardBackBtn').addEventListener('click', wizardBack);
    $('#wizardCloseBtn').addEventListener('click', closeWizard);

    // ========== 备注弹窗 ==========
    var noteTodoId = null;
    function openNoteOverlay(todo) {
      noteTodoId = todo.id;
      $('#editDueDate').value = todo.dueDate || '';
      $('#editEstimate').value = todo.estimate || '';
      $('#editTags').value = (todo.tags || []).join(', ');
      $('#noteText').value = todo.note || '';
      var tagChoices = document.getElementById('noteTagChoices');
      tagChoices.innerHTML = '';
      var tags = allTags();
      tags.forEach(function(tag) {
        var btn = makeEl('button', 'preset-tag-btn', tag);
        btn.type = 'button';
        btn.dataset.tag = tag;
        btn.addEventListener('click', function() {
          var input = $('#editTags');
          var current = input.value.split(',').map(s => s.trim()).filter(Boolean);
          if (current.indexOf(tag) === -1) {
            current.push(tag);
            input.value = current.join(', ');
          }
        });
        tagChoices.appendChild(btn);
      });
      $('#noteOverlay').classList.remove('hidden');
      $('#editDueDate').focus();
    }
    function closeNoteOverlay() { $('#noteOverlay').classList.add('hidden'); }

    $('#noteSaveBtn').addEventListener('click', function () {
      var todo = findTodo(noteTodoId);
      if (todo) {
        todo.dueDate = $('#editDueDate').value;
        todo.estimate = Number($('#editEstimate').value) || 0;
        todo.tags = $('#editTags').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        todo.note = $('#noteText').value;
        ensureTags(todo.tags);
        saveTodos();
        renderTodos();
      }
      closeNoteOverlay();
    });
    $('#noteCloseBtn').addEventListener('click', closeNoteOverlay);

    // ========== 卡项事件 ==========
    $('#addCardBtnMain').addEventListener('click', openCardForm);
    $('#cardSaveBtn').addEventListener('click', saveCardForm);
    $('#cardCloseBtn').addEventListener('click', closeCardForm);

    document.querySelectorAll('input[name="cardType"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        $('#cardTotal').disabled = (this.value !== 'count');
        if (this.value !== 'count') $('#cardTotal').value = '';
      });
    });

    $('#cardDetailCloseBtn').addEventListener('click', closeCardDetail);

    $('#cardDetailCancelBtn').addEventListener('click', function() {
      var editBtn = $('#cardDetailEditBtn');
      var cancelBtn = $('#cardDetailCancelBtn');
      var deleteBtn = $('#cardDetailDeleteBtn');
      var saveBtn = $('#cardDetailSaveBtn');
      editBtn.style.display = '';
      cancelBtn.style.display = 'none';
      deleteBtn.style.display = 'none';
      saveBtn.style.display = 'none';
      renderCardDetail(cardDetailId);
    });

    $('#cardDetailDeleteBtn').addEventListener('click', function() {
      if (cardDetailId) deleteCard(cardDetailId);
    });

    $('#cardDetailSaveBtn').addEventListener('click', function() {
      var card = state.cards.find(function (c) { return c.id === cardDetailId; });
      if (!card) return;
      var name = document.getElementById('cardEdit_name').value.trim();
      if (!name) return;
      card.name = name;
      var type = document.getElementById('cardEdit_type').value;
      card.type = type;
      card.start = document.getElementById('cardEdit_start').value;
      card.end = document.getElementById('cardEdit_end').value;
      card.totalCount = Number(document.getElementById('cardEdit_totalCount').value) || 0;
      card.cost = Number(document.getElementById('cardEdit_cost').value) || 0;
      card.note = document.getElementById('cardEdit_note').value;
      saveCards();
      var editBtn = $('#cardDetailEditBtn');
      var cancelBtn = $('#cardDetailCancelBtn');
      var deleteBtn = $('#cardDetailDeleteBtn');
      var saveBtn = $('#cardDetailSaveBtn');
      editBtn.style.display = '';
      cancelBtn.style.display = 'none';
      deleteBtn.style.display = 'none';
      saveBtn.style.display = 'none';
      renderCardDetail(cardDetailId);
      renderCards();
    });

    $('#cardDetailOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeCardDetail();
    });

    $('#cardStatusCapsule').addEventListener('click', function () { showView('cards'); });

    $('#toggleExpiredBtn').addEventListener('click', function() {
      state.showExpired = !state.showExpired;
      renderCards();
    });

    // ========== 固定日常每日重置 ==========
    function resetRoutinesIfNewDay() {
      var lastDate = loadJSON('dplan.v1.lastVisitDate', null);
      var today = todayKey();
      if (lastDate !== today) {
        state.routines.forEach(function (routine) {
          routine.done = false;
        });
        saveToday();
        var template = routinesTemplate();
        template.forEach(function (r) {
          r.done = false;
        });
        saveJSON('dplan.v1.routines', template);
        renderRoutines();
        saveJSON('dplan.v1.lastVisitDate', today);
      }
    }

    resetRoutinesIfNewDay();

    // ========== 导出 / 导入 ==========
    function downloadFile(filename, content, mime) {
      var blob = new Blob([content], { type: mime || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function collectAllData() {
      var data = { exportedAt: new Date().toISOString(), version: 1 };
      try {
        for (var i = 0; i < storage.length; i++) {
          var key = storage.key(i);
          if (key && key.indexOf('dplan.') === 0) {
            data[key] = storage.getItem(key);
          }
        }
      } catch (err) {}
      return data;
    }

    function exportJson() {
      var data = collectAllData();
      var json = JSON.stringify(data, null, 2);
      downloadFile('每日计划备份-' + todayKey() + '.json', json, 'application/json');
      showToast('✅ 全部数据已导出为 JSON 备份');
    }

    function exportTodayCsv() {
      var rows = [['开始时间', '结束时间', '标题', '图标']];
      state.actualBlocks.forEach(function (b) {
        rows.push([b.start, b.end, b.title, b.emoji || '']);
      });
      var csv = rows.map(function (r) {
        return r.map(function (c) {
          var s = String(c == null ? '' : c);
          if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
          return s;
        }).join(',');
      }).join('\n');
      downloadFile('今日计划-' + state.key + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
      showToast('✅ 今日计划已导出为 CSV');
    }

    function exportTodayText() {
      var lines = [];
      lines.push('每日计划 · ' + fmtKey(state.key));
      lines.push('');
      lines.push('【今日实际安排】');
      if (state.actualBlocks.length === 0) lines.push('  （无）');
      state.actualBlocks.forEach(function (b) {
        lines.push('  ' + b.start + ' - ' + b.end + '\t' + (b.title || '（未填写）') + ' ' + (b.emoji || ''));
      });
      lines.push('');
      lines.push('【本周目标】');
      var goalDone = state.goals.filter(function (g) { return g.done; }).length;
      lines.push('  完成 ' + goalDone + ' / ' + state.goals.length);
      state.goals.forEach(function (g) {
        var mark = g.done ? '[x]' : '[ ]';
        lines.push('  ' + mark + ' ' + (g.text || '（未填写）'));
      });
      lines.push('');
      lines.push('【固定日常】');
      var routineDone = state.routines.filter(function (r) { return r.done; }).length;
      lines.push('  完成 ' + routineDone + ' / ' + state.routines.length);
      state.routines.forEach(function (r) {
        var mark = r.done ? '[x]' : '[ ]';
        lines.push('  ' + mark + ' ' + (r.text || '（未填写）'));
      });
      lines.push('');
      lines.push('【待办事项】');
      var activeTodos = state.todos.filter(function (t) { return !t.done; });
      if (activeTodos.length === 0) lines.push('  （无待办）');
      activeTodos.forEach(function (t) {
        var q = QUADRANT_LABELS[t.quadrant] || '';
        var tag = (t.tags && t.tags.length) ? ' #' + t.tags.join(' #') : '';
        var due = t.dueDate ? '  截止 ' + t.dueDate : '';
        lines.push('  - ' + t.text + '（' + q + '）' + tag + due);
      });
      var text = lines.join('\n');
      downloadFile('今日计划-' + state.key + '.txt', '\ufeff' + text, 'text/plain;charset=utf-8');
      showToast('✅ 今日计划已导出为文本');
    }

    function importJson(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          if (!data || typeof data !== 'object') throw new Error('格式错误');
          var count = 0;
          Object.keys(data).forEach(function (key) {
            if (key.indexOf('dplan.') === 0 && typeof data[key] === 'string') {
              storage.setItem(key, data[key]);
              count++;
            }
          });
          showToast('✅ 成功导入 ' + count + ' 条数据，页面即将刷新');
          setTimeout(function () { location.reload(); }, 1500);
        } catch (err) {
          showAlert('导入失败：文件不是有效的备份格式。', 'warning');
        }
      };
      reader.readAsText(file);
    }

    function openExportOverlay() {
      $('#importFileInput').value = '';
      $('#exportOverlay').classList.remove('hidden');
    }
    function closeExportOverlay() { $('#exportOverlay').classList.add('hidden'); }

    $('#exportBtn').addEventListener('click', openExportOverlay);
    $('#exportCloseBtn').addEventListener('click', closeExportOverlay);
    $('#exportCloseFootBtn').addEventListener('click', closeExportOverlay);
    $('#exportOverlay').addEventListener('click', function (e) { if (e.target === this) closeExportOverlay(); });
    $('#exportJsonBtn').addEventListener('click', exportJson);
    $('#exportCsvBtn').addEventListener('click', exportTodayCsv);
    $('#exportTextBtn').addEventListener('click', exportTodayText);
    $('#importApplyBtn').addEventListener('click', function () {
      var input = $('#importFileInput');
      if (!input.files || input.files.length === 0) {
        showToast('请先选择要导入的 JSON 文件');
        return;
      }
      importJson(input.files[0]);
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeExportOverlay();
    });

    // ========== 键盘 ==========
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeWizard();
        closeNoteOverlay();
        closeReminderOverlay();
        closeCardForm();
        closeCardDetail();
        $('#importantDateOverlay').classList.add('hidden');
        closeTemplatePreview();
        $('#generalTemplateOverlay').classList.add('hidden');
        $('#historyOverlay').classList.add('hidden');
        $('#yearViewOverlay').classList.add('hidden');
      }
    });

  })();
</script>
</body>
</html>
